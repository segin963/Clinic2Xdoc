<!DOCTYPE html>
<html lang="uk">
<head>

<meta charset="UTF-8">
<title>Онлайн запис до лікаря у Рівному | Clinic2x </title>
<meta name="description"
content="Онлайн запис до лікаря у Рівному. Запис на прийом без черги.">

<style>

body{
font-family: Arial;
background:#f2f6fb;
margin:0;
}

header{
background:#2c7be5;
color:white;
padding:25px;
text-align:center;
font-size:28px;
}

.container{
width:400px;
margin:40px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.15);
}

h2{
text-align:center;
margin-bottom:25px;
}

label{
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:20px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}

button{
width:100%;
background:#28a745;
color:white;
border:none;
padding:15px;
font-size:18px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#218838;
}

footer{
text-align:center;
margin-top:30px;
color:#777;
}

.phone{
font-size:20px;
color:#2c7be5;
margin-top:10px;
}

</style>

</head>

<body>

<header>
Clinic2x<br>
Онлайн запис до лікаря
</header>

<div class="container">

<h2>Запис на прийом</h2>

<form>

<label>ПІБ</label>
<input type="text" placeholder="Ваше ім'я">

<label>Телефон</label>
<input type="text" placeholder="+380...">

<label>Лікар</label>
<select>
<option>Терапевт</option>
<option>Кардіолог</option>
<option>Невролог</option>
<option>Педіатр</option>
</select>

<label>Дата</label>
<input type="date">

<label>Час</label>
<select>
<option>09:00</option>
<option>09:30</option>
<option>10:00</option>
<option>10:30</option>
<option>11:00</option>
<option>11:30</option>
</select>

<button>Записатися</button>

</form>

</div>

<footer>

Телефон реєстратури

<div class="phone">
+38 (096) 097-51-50 
</div>

</footer>

</body>
</html>
